exemplos_negocios:
  - Consultório odontológico individual de dentista clínico geral
  - Clínica odontológica com múltiplos especialistas (ortodontia, implantodontia, endodontia)
  - Clínica de odontologia estética e reabilitação oral
  - Consultório de odontopediatria
  - Clínica de periodontia e cirurgia oral
  - Serviço odontológico ambulatorial vinculado a plano de saúde
o_que_inclui:
  - Consultas e avaliações odontológicas realizadas por cirurgião-dentista
  - Tratamentos clínicos como restaurações, extrações e tratamentos de canal
  - Procedimentos de ortodontia e instalação de aparelhos
  - Cirurgias orais ambulatoriais, como extração de sisos e implantes dentários
  - Atendimentos de odontopediatria
  - Procedimentos de periodontia, como raspagem e tratamento de gengiva
  - Clareamento dental e outros procedimentos de odontologia estética
o_que_nao_inclui:
  - Consultas e procedimentos realizados exclusivamente por médicos (use CNAE 8630-5/01 ou 8630-5/03)
  - Serviços de vacinação e imunização aplicados no mesmo estabelecimento (use CNAE 8630-5/06)
  - Laboratórios de prótese dentária sem atendimento direto ao paciente (use CNAE 3250-7/06)
  - Comércio de equipamentos e materiais odontológicos (use CNAE 4664-8/00)
  - Atividades de reprodução humana assistida (use CNAE 8630-5/07)
licencas_comuns:
  - Alvará municipal de funcionamento
  - Alvará sanitário estadual ou municipal (vigilância sanitária)
  - Licença ou registro no Conselho Regional de Odontologia (CRO)
  - Auto de Vistoria do Corpo de Bombeiros (AVCB)
  - Licença para gerenciamento de resíduos de serviços de saúde
