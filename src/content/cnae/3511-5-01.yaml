exemplos_negocios:
  - Usina hidrelétrica de pequeno, médio ou grande porte
  - Parque de geração de energia solar fotovoltaica em escala comercial
  - Parque eólico para geração e venda de energia elétrica
  - Usina termelétrica movida a gás natural ou biomassa
  - Pequena Central Hidrelétrica (PCH) com venda de energia ao sistema
  - Usina de geração de energia a partir de biogás ou resíduos sólidos
o_que_inclui:
  - Geração de energia elétrica por fonte hídrica (hidrelétricas e PCHs)
  - Geração de energia elétrica por fonte solar fotovoltaica em escala de usina
  - Geração de energia elétrica por fonte eólica
  - Geração de energia elétrica por fonte termelétrica (gás, biomassa, carvão, óleo)
  - Geração de energia elétrica por fonte nuclear
  - Operação e manutenção das instalações de geração dentro do próprio empreendimento
o_que_nao_inclui:
  - Coordenação e controle da operação de geração e transmissão de energia (use CNAE 3511-5/02)
  - Transmissão de energia elétrica pelas linhas de alta tensão (use CNAE 3512-3/00)
  - Distribuição de energia elétrica até o consumidor final (use CNAE 3513-1/00)
  - Comercialização e corretagem de energia elétrica (use CNAE 3514-0/00)
  - Instalação de painéis solares em residências ou empresas como serviço (use CNAE 4321-5/00)
licencas_comuns:
  - Licença ambiental (prévia, de instalação e de operação) emitida pelo órgão ambiental competente
  - Autorização ou concessão setorial do órgão regulador federal de energia elétrica
  - Licença ou autorização municipal de funcionamento do empreendimento
  - Outorga de uso de recursos hídricos, quando aplicável à fonte geradora
