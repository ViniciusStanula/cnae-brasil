o_que_inclui:
  - Costura de peças íntimas com material fornecido pelo contratante
  - Montagem, overloque e acabamento das peças recebidas cortadas
  - Serviço remunerado por peça produzida ou por lote
  - Aplicação de elásticos, rendas, alças e aviamentos fornecidos
  - Devolução das peças prontas ao contratante
o_que_nao_inclui:
  - Confecção de roupas íntimas com material e marca próprios (use CNAE 1411-8/01)
  - Facção de peças do vestuário que não roupas íntimas (use CNAE 1412-6/03)
  - Facção de roupas profissionais (use CNAE 1413-4/03)
  - Serviços de reparação e ajuste de roupas (use CNAE 9529-1/05)
  - Comércio varejista de roupas íntimas (use CNAE 4781-4/00)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Certificado de Vistoria do Corpo de Bombeiros
  - Programa de controle de riscos ocupacionais para a equipe de costura
  - Contrato formal de prestação de serviço com o contratante
