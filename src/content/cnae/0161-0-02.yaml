exemplos_negocios:
  - Prestador de serviço de poda em pomares de citros
  - Equipe terceirizada de poda de cafezais
  - Podador de parreirais e vinhedos contratado por safra
  - Prestador de poda de formação em plantios de fruteiras
  - Serviço de desbaste e condução de árvores em lavouras permanentes
o_que_inclui:
  - Poda de formação, produção e limpeza de árvores frutíferas
  - Poda e condução de cafezais, parreirais e pomares
  - Desbaste de ramos e retirada de material podado da lavoura
  - Serviço prestado por conta de terceiros, sem posse da lavoura
  - Operação de equipamentos e ferramentas de poda contratados pelo produtor
o_que_nao_inclui:
  - Poda de árvores urbanas e de jardins, fora de lavouras (use CNAE 8130-3/00)
  - Serviço de pulverização e controle de pragas agrícolas (use CNAE 0161-0/01)
  - Serviço de preparo de terreno, cultivo e colheita (use CNAE 0161-0/03)
  - Cultivo da lavoura em nome próprio, e não como serviço (use o CNAE do cultivo correspondente)
  - Outras atividades de apoio à agricultura sem código específico (use CNAE 0161-0/99)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Cadastro no órgão estadual de agricultura, quando exigido
  - Comprovação de treinamento em segurança do trabalho rural (NR-31) para a equipe
  - Registro de responsável técnico, quando exigido pelo contratante
