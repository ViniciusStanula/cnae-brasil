exemplos_negocios:
  - Carpintaria de forros e lambris de madeira
  - Fabricante de decks e pergolados para áreas externas
  - Produtor de estruturas e treliças de madeira para telhados
  - Marcenaria de escadas e corrimãos de madeira
  - Fabricante de fôrmas de madeira para concretagem
o_que_inclui:
  - Fabricação de forros, lambris e réguas de madeira
  - Produção de decks, pergolados e painéis externos
  - Fabricação de estruturas, treliças e tesouras para telhado
  - Produção de escadas, corrimãos e guarda-corpos de madeira
  - Fabricação de fôrmas e escoramentos de madeira para obras
o_que_nao_inclui:
  - Fabricação de casas de madeira pré-fabricadas (use CNAE 1622-6/01)
  - Fabricação de esquadrias de madeira, como portas e janelas (use CNAE 1622-6/02)
  - Fabricação de artefatos diversos de madeira, exceto móveis (use CNAE 1629-3/01)
  - Fabricação de móveis de madeira (use CNAE 3101-2/00)
  - Serviços de instalação de forros e divisórias na obra (use CNAE 4330-4/02)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Certificado de Vistoria do Corpo de Bombeiros
  - Cadastro Técnico Federal do IBAMA para uso de madeira
  - Documento de Origem Florestal (DOF) para a madeira utilizada
  - Programa de controle de riscos ocupacionais pela exposição a pó de madeira
