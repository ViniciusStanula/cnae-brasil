o_que_inclui:
  - Fotografia de retratos, famílias e ensaios pessoais em estúdio ou externa
  - Fotografia de casamentos, formaturas e eventos sociais
  - Fotografia publicitária, de produtos e para e-commerce
  - Fotografia de moda, editorial e campanhas
  - Fotografia escolar e de identificação
  - Fotografia jornalística e documental realizada em terra
  - Edição e tratamento de imagens como parte do serviço fotográfico contratado
o_que_nao_inclui:
  - Fotografia aérea (com drones ou aeronaves) e fotografia submarina (use CNAE 7420-0/02)
  - Revelação, impressão e ampliação de fotos em laboratório (use CNAE 7420-0/03)
  - Filmagem de festas e eventos em vídeo (use CNAE 7420-0/04)
  - Serviços de microfilmagem de documentos (use CNAE 7420-0/05)
  - Produção de filmes e vídeos publicitários (use CNAE 5911-1/02)
licencas_comuns:
  - Alvará municipal de funcionamento
  - AVCB (Auto de Vistoria do Corpo de Bombeiros), quando há estúdio físico com atendimento ao público
  - Alvará sanitário, quando aplicável ao município para estúdios com atendimento presencial
  - Registro na Receita Federal como MEI ou empresa, conforme o porte
