  - Empresa de climatização predial e comercial
  - Prestador de higienização de sistemas de ar-condicionado
o_que_inclui:
  - Instalação de sistemas centrais de ar-condicionado e VRF
  - Montagem de dutos, difusores e sistemas de ventilação
  - Instalação de câmaras frias e sistemas de refrigeração predial
  - Manutenção preventiva, corretiva e higienização dos sistemas
  - Carga de gás refrigerante e teste de estanqueidade
o_que_nao_inclui:
  - Manutenção de máquinas de refrigeração para uso industrial e comercial (use CNAE 3314-7/07)
  - Instalações hidráulicas, sanitárias e de gás (use CNAE 4322-3/01)
  - Instalação e manutenção elétrica (use CNAE 4321-5/00)
  - Reparação de aparelhos eletrodomésticos, como ar-condicionado de janela (use CNAE 9521-5/00)
  - Tratamentos térmicos, acústicos ou de vibração (use CNAE 4329-1/05)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no CREA ou CRT com responsável técnico
  - Cadastro Técnico Federal do IBAMA para manuseio de gases refrigerantes
  - Plano de Manutenção, Operação e Controle (PMOC) para os sistemas atendidos
  - Programa de controle de riscos ocupacionais e NR-35 para trabalho em altura
