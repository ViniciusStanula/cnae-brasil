o_que_inclui:
  - Rebobinamento de motores elétricos e geradores
  - Manutenção preventiva e corretiva de transformadores
  - Substituição de rolamentos, escovas e componentes
  - Testes elétricos, isolação e balanceamento
  - Serviço executado em oficina ou em campo
o_que_nao_inclui:
  - Manutenção e reparação de baterias e acumuladores elétricos (use CNAE 3313-9/02)
  - Manutenção de máquinas, aparelhos e materiais elétricos sem código próprio (use CNAE 3313-9/99)
  - Fabricação de motores elétricos, peças e acessórios (use CNAE 2710-4/03)
  - Recondicionamento e recuperação de motores para veículos (use CNAE 2950-6/00)
  - Instalação elétrica em edificações (use CNAE 4321-5/00)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no CREA ou CRT com responsável técnico
  - Certificado de Vistoria do Corpo de Bombeiros
  - Licença ambiental para descarte de óleos e vernizes
  - Cumprimento da NR-10 para serviços em eletricidade
