o_que_inclui:
  - Diagnóstico eletrônico e leitura de códigos de falha
  - Reparo e substituição de alternadores e motores de partida
  - Manutenção de baterias, cabos e sistema de carga
  - Reparo de chicotes, módulos e sensores de injeção
  - Instalação e reparo de iluminação e sistemas elétricos do veículo
o_que_nao_inclui:
  - Serviços de manutenção e reparação mecânica de veículos (use CNAE 4520-0/01)
  - Serviços de lanternagem e pintura de veículos (use CNAE 4520-0/02)
  - Instalação e reparação de acessórios para veículos, como som e alarme (use CNAE 4520-0/07)
  - Recondicionamento de baterias e acumuladores para veículos (use CNAE 2722-8/02)
  - Manutenção de geradores, transformadores e motores elétricos (use CNAE 3313-9/01)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Licença ambiental para descarte de baterias e resíduos
  - Certificado de Vistoria do Corpo de Bombeiros
  - Programa de controle de riscos ocupacionais e NR-10
  - Registro no CRT com responsável técnico, quando exigido
