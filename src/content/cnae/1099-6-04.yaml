exemplos_negocios:
  - Fábrica de gelo em cubos para bares e eventos
  - Produtor de gelo em barra para pescadores e feiras
  - Fabricante de gelo em escamas para peixarias
  - Fábrica de gelo com entrega a lanchonetes e distribuidoras
  - Produtor de gelo filtrado embalado para o varejo
o_que_inclui:
  - Fabricação de gelo em cubos, barras, escamas e blocos
  - Tratamento e filtragem da água usada na produção
  - Ensacamento e embalagem do gelo produzido
  - Armazenagem em câmara fria e entrega ao cliente
  - Produção de gelo para conservação de alimentos e pescados
o_que_nao_inclui:
  - Fabricação de gelo seco, que é produto químico (use CNAE 2014-2/00)
  - Fabricação de sorvetes e outros gelados comestíveis (use CNAE 1053-8/00)
  - Fabricação de águas envasadas (use CNAE 1121-6/00)
  - Comércio atacadista de gelo adquirido de terceiros (use CNAE 4639-7/01)
  - Preservação de pescado com uso de gelo (use CNAE 1020-1/01)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Licença da vigilância sanitária municipal
  - Laudo de potabilidade da água utilizada na produção
  - Licença ambiental, quando exigida pelo porte
  - Certificado de Vistoria do Corpo de Bombeiros
