  - Moagem de milho e fabricação de fubá, farinha ou amido (use CNAE 1064-3/00)
  - Fabricação de rações balanceadas a partir do milho (use CNAE 1066-0/00)
  - Serviços de preparo de terreno e colheita prestados a terceiros (use CNAE 0161-0/03)
