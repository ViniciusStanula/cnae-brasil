  - Chácara de eventos com estrutura completa
o_que_inclui:
  - Locação de salão ou espaço equipado para festas
  - Fornecimento de mesas, cadeiras, som e iluminação do espaço
  - Estrutura de cozinha, banheiros e estacionamento
  - Serviços de recepção, limpeza e organização do evento
  - Pacotes de festa com alimentação e decoração incluídas
o_que_nao_inclui:
  - Serviços de organização de feiras, congressos, exposições e festas (use CNAE 8230-0/01)
  - Serviços de alimentação para eventos e recepções (use CNAE 5620-1/02)
  - Aluguel de palcos, coberturas e estruturas temporárias (use CNAE 7739-0/03)
  - Bares e estabelecimentos especializados em servir bebidas, com entretenimento (use CNAE 5611-2/05)
  - Discotecas, danceterias, salões de dança e similares (use CNAE 9329-8/01)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Certificado de Vistoria do Corpo de Bombeiros
  - Licença da vigilância sanitária, quando houver cozinha
  - Alvará de som e licença para eventos com música
  - Recolhimento de direitos autorais ao ECAD
