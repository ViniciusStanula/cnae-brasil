  - Comércio atacadista de tintas e solventes para revendedores (use CNAE 4679-6/04)
  - Fabricação de tintas, vernizes e esmaltes (use CNAE 2071-1/00)
  - Venda de equipamentos de pintura industrial, como compressores e pistolas (use CNAE 4744-0/99)
