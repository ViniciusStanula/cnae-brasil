  - Aluguel de material médico (use CNAE 7729-2/03)
  - Atividades de assistência social prestadas em residências coletivas (use CNAE 8730-1/99)
  - Aluguel de equipamentos científicos, médicos e hospitalares (use CNAE 7739-0/02)
licencas_comuns:
