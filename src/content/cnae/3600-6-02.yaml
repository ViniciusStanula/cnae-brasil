  - Atividades relacionadas a esgoto, exceto a gestão de redes (use CNAE 3702-9/00)
  - Transporte rodoviário de cargas em geral (use CNAE 4930-2/02)
  - Fabricação de águas envasadas (use CNAE 1121-6/00)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Licença da vigilância sanitária para transporte de água potável
  - Outorga de uso de água do órgão gestor de recursos hídricos
  - Laudo periódico de potabilidade da água transportada
  - Registro e vistoria do veículo com tanque adequado
