exemplos_negocios:
  - Canil com criação e venda de filhotes de raça
  - Gatil especializado em uma ou mais raças felinas
  - Criador de aves de gaiola, como canários e calopsitas
  - Criador de hamsters, coelhos e outros pequenos roedores de estimação
  - Criatório de aves ornamentais registrado no órgão ambiental
o_que_inclui:
  - Reprodução e criação de cães e gatos para venda como animais de companhia
  - Criação de aves de gaiola e ornamentais destinadas a estimação
  - Criação de coelhos, hamsters e outros pequenos mamíferos de estimação
  - Manutenção de matrizes e reprodutores do próprio plantel
  - Venda direta dos filhotes produzidos ao consumidor ou a lojas especializadas
o_que_nao_inclui:
  - Criação de peixes ornamentais em água doce (use CNAE 0322-1/04)
  - Criação de peixes ornamentais em água salgada e salobra (use CNAE 0321-3/04)
  - Comércio varejista de animais adquiridos de terceiros, como pet shops (use CNAE 4789-0/04)
  - Serviços veterinários e atendimento clínico a animais (use CNAE 7500-1/00)
  - Serviços de banho, tosa e higiene animal (use CNAE 9609-2/06)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no Conselho Regional de Medicina Veterinária (CRMV) com responsável técnico
  - Licença ambiental estadual para criadouro, especialmente de fauna silvestre
  - Registro no IBAMA para criação de aves e animais silvestres
  - Licença da vigilância sanitária municipal
