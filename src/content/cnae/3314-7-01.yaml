  - Oficina de motores a gás para indústria
  - Prestador de reparo de motores marítimos estacionários
o_que_inclui:
  - Manutenção preventiva e corretiva de motores a combustão estacionários
  - Reparo de turbinas a vapor, gás e hidráulicas
  - Substituição de peças, ajustes e regulagem de motores
  - Testes de desempenho e diagnóstico de falhas
  - Serviço executado em oficina ou em campo
o_que_nao_inclui:
  - Recondicionamento e recuperação de motores para veículos automotores (use CNAE 2950-6/00)
  - Manutenção de geradores, transformadores e motores elétricos (use CNAE 3313-9/01)
  - Manutenção de equipamentos hidráulicos e pneumáticos (use CNAE 3314-7/02)
  - Manutenção de compressores (use CNAE 3314-7/04)
  - Manutenção mecânica de veículos automotores (use CNAE 4520-0/01)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no CREA ou CRT com responsável técnico
  - Licença ambiental para descarte de óleos e resíduos
  - Certificado de Vistoria do Corpo de Bombeiros
  - Programa de controle de riscos ocupacionais
