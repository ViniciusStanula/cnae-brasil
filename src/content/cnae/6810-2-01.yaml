exemplos_negocios:
  - Incorporadora que compra terrenos, constrói empreendimentos residenciais e vende as unidades prontas
  - Empresa que adquire imóveis antigos, reforma e revende
  - Sociedade patrimonial que compra e revende apartamentos como atividade principal
  - Empresa de desenvolvimento imobiliário que compra glebas urbanas e revende como lotes urbanizados
  - Holding imobiliária que mantém portfólio de imóveis para compra e venda
o_que_inclui:
  - Compra de imóveis residenciais (casas, apartamentos) para posterior revenda
  - Compra de imóveis comerciais (salas, lojas, galpões) para posterior revenda
  - Compra de terrenos urbanos para revenda sem parcelamento
  - Revenda de imóveis próprios adquiridos anteriormente pela empresa
  - Compra e venda de imóveis rurais de propriedade da própria empresa
  - Aquisição de imóveis em leilão para revenda
o_que_nao_inclui:
  - Aluguel ou arrendamento de imóveis que a empresa possui (use CNAE 6810-2/02)
  - Parcelamento e venda de terrenos em loteamentos próprios (use CNAE 6810-2/03)
  - Intermediação na compra e venda de imóveis de terceiros, como corretagem (use CNAE 6821-8/01)
  - Administração de imóveis de terceiros por conta de proprietários (use CNAE 6822-6/00)
  - Construção de edifícios para venda, quando a atividade principal é a construção (use CNAE 4110-7/00)
licencas_comuns:
  - Alvará municipal de funcionamento
  - Licenças urbanísticas e de parcelamento do solo emitidas pelo município
  - Licença ambiental (quando a atividade envolver imóveis em áreas de interesse ambiental)
  - Registro e averbação dos imóveis no Cartório de Registro de Imóveis
