o_que_inclui:
  - Fabricação de utensílios domésticos de madeira, como tábuas e colheres
  - Produção de cabos de madeira para ferramentas e vassouras
  - Fabricação de molduras, quadros e objetos decorativos
  - Produção de cabides, caixas organizadoras e peças utilitárias
  - Torneamento, lixamento, envernizamento e acabamento das peças
o_que_nao_inclui:
  - Fabricação de artefatos de cortiça, bambu, palha e vime (use CNAE 1629-3/02)
  - Fabricação de embalagens e artefatos de tanoaria (use CNAE 1623-4/00)
  - Fabricação de artigos de carpintaria para construção (use CNAE 1622-6/99)
  - Fabricação de móveis de madeira (use CNAE 3101-2/00)
  - Fabricação de brinquedos e jogos recreativos (use CNAE 3240-0/99)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Certificado de Vistoria do Corpo de Bombeiros
  - Cadastro Técnico Federal do IBAMA para uso de madeira
  - Documento de Origem Florestal (DOF) para a madeira utilizada
  - Programa de controle de riscos ocupacionais pela exposição a pó de madeira
