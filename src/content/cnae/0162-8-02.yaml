exemplos_negocios:
  - Tosquiador autônomo que atende cabanhas por temporada
  - Equipe de tosquia contratada por estâncias de ovinos
  - Prestador de tosquia com máquina própria em rota entre propriedades
  - Serviço de tosquia associado ao enfardamento da lã
  - Tosquiador contratado por cooperativa de produtores de lã
o_que_inclui:
  - Tosquia manual ou mecanizada de ovinos por conta de terceiros
  - Retirada, classificação e acondicionamento da lã na propriedade
  - Enfardamento da lã como etapa do serviço prestado
  - Deslocamento de equipe e equipamento entre propriedades contratantes
  - Serviço remunerado por animal tosquiado ou por diária
o_que_nao_inclui:
  - Criação de ovinos em nome próprio, inclusive para lã (use CNAE 0153-9/02)
  - Serviço de inseminação artificial de animais (use CNAE 0162-8/01)
  - Serviço de manejo de animais em geral (use CNAE 0162-8/03)
  - Beneficiamento e fiação industrial da lã (use CNAE 1311-1/00)
  - Outras atividades de apoio à pecuária sem código específico (use CNAE 0162-8/99)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Cadastro no órgão estadual de agricultura ou defesa agropecuária
  - Comprovação de treinamento em segurança do trabalho rural (NR-31)
  - Cumprimento das regras sanitárias de trânsito entre propriedades
