  - Fabricação de pós alimentícios e refrescos em pó (use CNAE 1099-6/02)
  - Fabricação de refrigerantes e bebidas prontas (use CNAE 1122-4/01)
  - Cultivo das frutas em nome próprio (use o CNAE do cultivo correspondente)
