  - Fabricação de néctares e sucos adoçados de frutas e vegetais
  - Pasteurização e engarrafamento do suco produzido
  - Fabricação de sucos a partir de polpa ou concentrado adquirido
  - Rotulagem e embalagem dos produtos fabricados
o_que_nao_inclui:
  - Fabricação de sucos concentrados, que tem código próprio (use CNAE 1033-3/01)
  - Fabricação de conservas e polpas de frutas (use CNAE 1031-7/00)
  - Fabricação de refrigerantes e outras bebidas não alcoólicas (use CNAE 1122-4/01)
  - Preparo e venda de sucos para consumo imediato em lanchonete (use CNAE 5611-2/03)
  - Cultivo das frutas em nome próprio (use o CNAE do cultivo correspondente)
licencas_comuns:
