  - Produção de carretéis e bobinas de madeira
  - Corte, montagem, tratamento e marcação das embalagens
o_que_nao_inclui:
  - Fabricação de artefatos diversos de madeira, exceto móveis (use CNAE 1629-3/01)
  - Fabricação de artigos de carpintaria para construção (use CNAE 1622-6/99)
  - Fabricação de embalagens de papel (use CNAE 1731-1/00)
  - Fabricação de embalagens de material plástico (use CNAE 2222-6/00)
  - Serrarias com desdobramento de madeira em bruto (use CNAE 1610-2/03)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Certificado de Vistoria do Corpo de Bombeiros
  - Cadastro Técnico Federal do IBAMA para uso de madeira
  - Documento de Origem Florestal (DOF) para a madeira utilizada
  - Certificação fitossanitária NIMF-15 para embalagens de exportação
