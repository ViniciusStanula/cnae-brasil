exemplos_negocios:
  - Usina de refino de açúcar de cana
  - Indústria produtora de açúcar refinado granulado a partir de cana
  - Fábrica de açúcar refinado especial (tipo cristal refinado ou refinado amorfo)
  - Planta industrial de refino de açúcar bruto de cana
  - Empresa de beneficiamento e refino de açúcar para uso alimentício
o_que_inclui:
  - Refino de açúcar bruto ou demerara proveniente da cana-de-açúcar
  - Produção de açúcar refinado granulado (cristal refinado)
  - Produção de açúcar refinado amorfo (açúcar de confeiteiro)
  - Processos industriais de clarificação, filtração e branqueamento do açúcar de cana
  - Embalagem e acondicionamento do açúcar refinado produzido na própria unidade fabril
  - Produção de açúcar de cana em diferentes granulometrias refinadas
o_que_nao_inclui:
  - Fabricação de açúcar de cereais (dextrose) ou de beterraba (use CNAE 1072-4/02)
  - Fabricação de açúcar bruto de cana sem refino, como demerara ou mascavo (use CNAE 1071-6/00)
  - Produção de melado, rapadura ou outros derivados não refinados da cana (use CNAE 1071-6/00)
  - Comércio atacadista de açúcar refinado sem produção própria (use CNAE 4633-8/01)
  - Produção de adoçantes artificiais ou edulcorantes (use CNAE 2099-1/99)
licencas_comuns:
  - Alvará municipal de funcionamento
  - Licença ambiental (operação industrial com geração de efluentes e resíduos)
  - Alvará sanitário ou registro no órgão federal de vigilância sanitária para alimentos
  - Auto de Vistoria do Corpo de Bombeiros (AVCB)
  - Licença de operação industrial estadual
