  - Prestador de conserto de guarda-chuvas
  - Oficina de reparo de instrumentos musicais
  - Prestador de conserto de utensílios domésticos
  - Ateliê de reparos diversos
o_que_inclui:
  - Ajuste, barra e conserto de roupas já prontas
  - Reparo de guarda-chuvas, malas pequenas e utensílios
  - Conserto de instrumentos musicais e objetos pessoais
  - Manutenção de artigos domésticos sem código próprio
  - Atendimento ao consumidor final em oficina ou domicílio
o_que_nao_inclui:
  - Reparação de calçados, de bolsas e artigos de viagem (use CNAE 9529-1/01)
  - Reparação de artigos do mobiliário (use CNAE 9529-1/05)
  - Reparação de relógios (use CNAE 9529-1/03)
  - Reparação de joias (use CNAE 9529-1/06)
  - Confecção, sob medida, de peças do vestuário, exceto roupas íntimas (use CNAE 1412-6/02)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Certificado de Vistoria do Corpo de Bombeiros
  - Licença ambiental, conforme os materiais utilizados
  - Programa de controle de riscos ocupacionais
  - Inscrição estadual, quando comercializar materiais
