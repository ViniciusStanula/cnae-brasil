o_que_inclui:
  - Travessia de passageiros e veículos entre duas margens
  - Operação de balsas, ferry-boats e catraias
  - Travessia em rios, lagos, baías e represas do município
  - Embarque e desembarque em rampas e terminais de travessia
  - Operação em linha regular de travessia
o_que_nao_inclui:
  - Transporte por navegação de travessia intermunicipal e interestadual (use CNAE 5091-2/02)
  - Transporte por navegação interior de carga, municipal (use CNAE 5021-1/01)
  - Transporte aquaviário para passeios turísticos (use CNAE 5099-8/01)
  - Transporte marítimo de cabotagem de carga (use CNAE 5011-4/01)
  - Outros transportes aquaviários não especificados (use CNAE 5099-8/99)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Autorização da ANTAQ ou do órgão estadual para travessia
  - Registro das embarcações na Marinha do Brasil
  - Habilitação de aquaviário para a tripulação
  - Certificados de segurança e lotação máxima das embarcações
