exemplos_negocios:
  - Restaurante por quilo (self-service)
  - Churrascaria com rodízio
  - Restaurante japonês com serviço de mesa
  - Restaurante italiano familiar
  - Restaurante executivo voltado para almoço corporativo
o_que_inclui:
  - Preparo e venda de refeições completas para consumo no local
  - Serviço de mesa com garçons em restaurantes tradicionais
  - Buffet self-service com cobrança por peso ou preço fixo
  - Venda de bebidas como acompanhamento das refeições
  - Rodízio de carnes, massas, sushi ou outros pratos
  - Entrega de refeições (delivery) como atividade complementar ao salão
o_que_nao_inclui:
  - Lanchonetes, casas de sucos e estabelecimentos de refeições rápidas (use CNAE 5611-2/03)
  - Bares e estabelecimentos cujo foco principal é servir bebidas, sem entretenimento (use CNAE 5611-2/04)
  - Bares com entretenimento ao vivo ou programação cultural (use CNAE 5611-2/05)
  - Fornecimento de refeições para coletividades, como empresas e escolas (use CNAE 5620-1/01)
  - Preparo e entrega exclusiva de marmitas e refeições sem salão de atendimento (use CNAE 5620-1/04)
licencas_comuns:
  - Alvará municipal de funcionamento
  - Alvará sanitário
  - Auto de Vistoria do Corpo de Bombeiros (AVCB)
  - Licença ambiental (quando aplicável à geração de resíduos ou emissões)
