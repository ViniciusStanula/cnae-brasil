exemplos_negocios:
  - Prestador de manutenção de fornos industriais
  - Empresa de reparo de estufas e secadores
  - Serviço de manutenção de trocadores de calor
  - Prestador de reforma de refratários de fornos
  - Oficina de manutenção de aquecedores industriais
o_que_inclui:
  - Manutenção preventiva e corretiva de fornos e estufas industriais
  - Reparo de secadores, trocadores de calor e aquecedores
  - Substituição de refratários, resistências e queimadores
  - Ajuste de controles de temperatura e sistemas de combustão
  - Serviço executado em campo ou em oficina
o_que_nao_inclui:
  - Manutenção e reparação de tanques, reservatórios e caldeiras (use CNAE 3311-2/00)
  - Manutenção de máquinas e aparelhos de refrigeração e ventilação industrial (use CNAE 3314-7/07)
  - Manutenção de máquinas motrizes não elétricas (use CNAE 3314-7/01)
  - Instalação de máquinas e equipamentos industriais (use CNAE 3321-0/00)
  - Manutenção de fogões e eletrodomésticos de uso doméstico (use CNAE 9521-5/00)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no CREA com responsável técnico
  - Certificado de Vistoria do Corpo de Bombeiros
  - Cumprimento da NR-13 e da NR-33, conforme o equipamento
  - Programa de controle de riscos ocupacionais pela exposição a calor
