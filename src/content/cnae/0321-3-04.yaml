exemplos_negocios:
  - Criatório de peixes marinhos ornamentais para lojas de aquarismo
  - Produtor de peixes-palhaço em sistema fechado de água salgada
  - Aquicultor de espécies ornamentais em água salobra litorânea
  - Criatório com reprodução em cativeiro de espécies marinhas de aquário
  - Produtor de peixes ornamentais marinhos com venda a distribuidores
o_que_inclui:
  - Reprodução e engorda de peixes ornamentais em água salgada ou salobra
  - Manutenção de matrizes e larvicultura de espécies marinhas de aquário
  - Operação de tanques, viveiros e sistemas de recirculação de água salgada
  - Seleção, acondicionamento e expedição dos peixes produzidos
  - Venda da produção própria a lojas, distribuidores ou consumidor final
o_que_nao_inclui:
  - Criação de peixes ornamentais em água doce (use CNAE 0322-1/04)
  - Criação de peixes em água salgada e salobra para consumo (use CNAE 0321-3/01)
  - Pesca de peixes em água salgada (use CNAE 0311-6/01)
  - Comércio varejista de peixes ornamentais adquiridos de terceiros (use CNAE 4789-0/04)
  - Atividades de apoio à aquicultura prestadas a terceiros (use CNAE 0321-3/05)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro de aquicultor no órgão federal competente
  - Licença ambiental estadual para o empreendimento aquícola
  - Outorga de uso de água, quando houver captação
  - Registro no IBAMA para criação e comércio de fauna aquática ornamental
