o_que_inclui:
  - Cultivo de aveia, centeio, cevada, sorgo e triticale em lavouras temporárias
  - Cultivo de qualquer outro cereal sem código específico na CNAE
  - Colheita dos grãos em estado bruto
  - Secagem e armazenagem do grão na própria propriedade rural, como etapa do cultivo
  - Cultivo de cereais destinados a grão, forragem ou cobertura de solo
o_que_nao_inclui:
