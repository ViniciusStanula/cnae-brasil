  - Cultivo de milho, que tem código próprio (use CNAE 0111-3/02)
  - Cultivo de trigo, que tem código próprio (use CNAE 0111-3/03)
  - Beneficiamento e moagem industrial dos grãos (use CNAE 1069-4/00)
  - Fabricação de malte a partir da cevada (use CNAE 1113-5/01)
  - Serviços de preparo de terreno e colheita prestados a terceiros (use CNAE 0161-0/03)
