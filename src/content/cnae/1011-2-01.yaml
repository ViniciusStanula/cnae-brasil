descricao_oficial: FRIGORÍFICO - ABATE DE BOVINOS
descricao_plana: >-
  Empresa que realiza o abate industrial de bovinos (bois, vacas, novilhos) em frigorífico, transformando o animal em
  carcaça e cortes para comercialização.
