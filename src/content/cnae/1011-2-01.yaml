exemplos_negocios:
  - Frigorífico industrial de abate de bois e vacas
  - Planta de abate bovino integrada a produção de cortes
  - Frigorífico exportador de carne bovina
  - Unidade de abate bovino de médio porte para mercado regional
  - Frigorífico com linha de abate e câmaras frigoríficas para bovinos
o_que_inclui:
  - Abate de bovinos (bois, vacas, novilhos, bezerros) em instalações frigoríficas
  - Obtenção de carcaças bovinas após o abate
  - Processamento primário da carne bovina logo após o abate (evisceração, divisão de carcaça)
  - Produção de subprodutos do abate bovino, como couro, vísceras e sebo, gerados no mesmo processo
  - Resfriamento e armazenamento das carcaças nas câmaras do próprio frigorífico
o_que_nao_inclui:
  - Abate de equinos (cavalos, mulas, asininos) — use CNAE 1011-2/02
  - Abate de ovinos e caprinos (ovelhas e cabras) — use CNAE 1011-2/03
  - Abate de bufalinos (búfalos) — use CNAE 1011-2/04
  - Abate de bovinos sob contrato para terceiros, sem posse do animal — use CNAE 1011-2/05
  - Abate de suínos — use CNAE 1012-1/01
  - Fabricação de produtos processados de carne bovina, como embutidos e conservas — use CNAE 1013-9/01
licencas_comuns:
  - Alvará sanitário federal (inspeção de produtos de origem animal)
  - Licença ambiental (instalação e operação)
  - Alvará municipal de funcionamento
  - Auto de Vistoria do Corpo de Bombeiros (AVCB)
  - Licença sanitária estadual ou municipal, conforme abrangência do mercado atendido
