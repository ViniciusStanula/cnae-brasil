exemplos_negocios:
  - Prestador de serviço de aração e gradagem com trator próprio
  - Equipe terceirizada de colheita contratada por safra
  - Operador de colheitadeira que atende várias fazendas
  - Prestador de serviço de plantio mecanizado de grãos
  - Empresa de tratos culturais para lavouras de cana e soja
o_que_inclui:
  - Preparo de solo, aração, gradagem, subsolagem e sulcamento
  - Plantio e semeadura mecanizada ou manual por conta de terceiros
  - Tratos culturais, capina e adubação de cobertura contratados pelo produtor
  - Colheita mecanizada ou manual prestada a terceiros
  - Operação de máquinas e implementos agrícolas com ou sem fornecimento do equipamento
  - Serviço remunerado por área, hora-máquina ou produção
o_que_nao_inclui:
  - Serviço de pulverização e controle de pragas agrícolas (use CNAE 0161-0/01)
  - Serviço de poda de árvores para lavouras (use CNAE 0161-0/02)
  - Atividades de pós-colheita, como secagem e beneficiamento (use CNAE 0163-6/00)
  - Cultivo da lavoura em nome próprio, e não como serviço (use o CNAE do cultivo correspondente)
  - Aluguel de máquinas agrícolas sem operador (use CNAE 7739-0/99)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Cadastro no órgão estadual de agricultura, quando exigido
  - Comprovação de treinamento em segurança do trabalho rural (NR-31) para operadores
  - Licenciamento e regularização das máquinas agrícolas utilizadas
