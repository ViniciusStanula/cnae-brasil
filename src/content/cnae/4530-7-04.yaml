  - Comércio de componentes retirados de veículos desmontados
  - Venda de peças de reposição para modelos fora de linha
  - Comércio em loja física ou pela internet
  - Classificação, teste e garantia das peças vendidas
o_que_nao_inclui:
  - Comércio a varejo de peças e acessórios novos (use CNAE 4530-7/03)
  - Comércio a varejo de pneumáticos e câmaras de ar (use CNAE 4530-7/05)
  - Recuperação de materiais metálicos, exceto alumínio (use CNAE 3831-9/99)
  - Serviços de manutenção e reparação mecânica de veículos (use CNAE 4520-0/01)
  - Comércio atacadista de resíduos e sucatas metálicas (use CNAE 4687-7/03)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Inscrição estadual para circulação de mercadorias
  - Registro no Detran para atividade de desmontagem, quando aplicável
  - Licença ambiental para armazenamento de peças e fluidos
  - Certificado de Vistoria do Corpo de Bombeiros
