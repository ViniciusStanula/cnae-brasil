exemplos_negocios:
  - Fábrica artesanal de picles e conservas de pepino
  - Produtor de conservas de pimenta e vegetais em vidro
  - Pequena indústria de milho e ervilha em conserva
  - Agroindústria familiar de legumes em conserva para o varejo
  - Produtor de antepastos e vegetais em azeite
o_que_inclui:
  - Fabricação de conservas de pepino, pimenta, cebola, milho e ervilha
  - Produção de picles, antepastos e vegetais em salmoura, vinagre ou azeite
  - Fabricação de legumes e verduras enlatados ou envasados em vidro
  - Cozimento, branqueamento, pasteurização e esterilização dos vegetais
  - Uso de vegetais da própria produção ou adquiridos de terceiros
  - Rotulagem e embalagem dos produtos fabricados
o_que_nao_inclui:
  - Fabricação de conservas de palmito, que tem código próprio (use CNAE 1032-5/01)
  - Fabricação de conservas de frutas (use CNAE 1031-7/00)
  - Fabricação de molhos, temperos e condimentos (use CNAE 1095-3/00)
  - Fabricação de pratos prontos e refeições congeladas (use CNAE 1096-1/00)
  - Cultivo dos vegetais em nome próprio (use o CNAE do cultivo correspondente)
licencas_comuns:
