  - Limpeza de caixas de gordura e separadores de água e óleo
  - Manutenção de sistemas individuais de tratamento de esgoto
o_que_nao_inclui:
  - Gestão de redes públicas de esgoto (use CNAE 3701-1/00)
  - Captação, tratamento e distribuição de água (use CNAE 3600-6/01)
  - Distribuição de água por caminhões (use CNAE 3600-6/02)
  - Coleta de resíduos não perigosos (use CNAE 3811-4/00)
  - Instalações hidráulicas e sanitárias em obras (use CNAE 4322-3/01)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Licença ambiental estadual para transporte e destinação de efluentes
  - Manifesto de transporte de resíduos e comprovante de destinação
  - Registro e vistoria do veículo limpa-fossa
  - Programa de controle de riscos ocupacionais e NR-33 para espaço confinado
