exemplos_negocios:
  - Supermercado de bairro com seções de hortifruti, açougue e mercearia
  - Rede local de supermercados com até 5 lojas
  - Supermercado compacto em galeria comercial urbana
  - Mercado de vizinhança com checkout e variedade de marcas
  - Supermercado familiar com seção de frios, laticínios e limpeza
o_que_inclui:
  - 'Venda de alimentos em geral: hortifruti, carnes, laticínios, frios, mercearia seca e bebidas'
  - Venda de produtos de limpeza, higiene pessoal e itens de uso doméstico como complemento à oferta alimentícia
  - Operação de seções internas como açougue, padaria e peixaria dentro do próprio supermercado
  - Venda de produtos embalados e a granel no balcão ou em gôndolas de autoatendimento
  - Comercialização de itens de bazar e utilidades domésticas como atividade secundária ao mix alimentício
o_que_nao_inclui:
  - Hipermercados com mix amplo de não-alimentos como eletrodomésticos e vestuário (use CNAE 4711-3/01)
  - Lojas especializadas exclusivamente em produtos naturais ou orgânicos (use CNAE 4729-6/99)
  - Padaria com produção própria de pães como atividade principal (use CNAE 1091-1/01)
  - Açougue independente sem mix de supermercado (use CNAE 4722-9/01)
  - Mercearia ou armazém de pequeno porte sem estrutura de supermercado (use CNAE 4712-1/00)
