  - Pousadas e hospedagens de pequeno porte com características similares (use CNAE 5590-6/01)
  - Albergues e hostels voltados a turismo de baixo custo (use CNAE 5590-6/02)
  - Campings e parques de lazer com hospedagem em tendas ou trailers (use CNAE 5590-6/03)
