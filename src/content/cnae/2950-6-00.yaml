  - Fabricação de peças e acessórios para o sistema motor (use CNAE 2941-7/00)
  - Manutenção e reparação mecânica de veículos automotores (use CNAE 4520-0/01)
  - Recondicionamento de baterias e acumuladores (use CNAE 2722-8/02)
  - Comércio de peças e acessórios para veículos (use CNAE 4530-7/03)
licencas_comuns:
