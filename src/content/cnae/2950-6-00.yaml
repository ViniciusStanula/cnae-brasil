o_que_inclui:
  - Desmontagem, limpeza e avaliação de motores usados
  - Retífica de blocos, cabeçotes, virabrequins e bielas
  - Substituição de pistões, anéis, camisas e bronzinas
  - Remontagem, regulagem e teste do motor recondicionado
  - Venda de motores recondicionados em troca do usado
o_que_nao_inclui:
