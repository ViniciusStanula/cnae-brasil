  - Banco múltiplo com carteira comercial e de arrendamento mercantil
o_que_inclui:
  - Captação de depósitos à vista e a prazo do público em geral
  - Concessão de crédito pessoal, empresarial e rural por meio da carteira comercial
  - Operações de câmbio, quando a instituição possui carteira de câmbio autorizada
  - Emissão de instrumentos de pagamento como cheques e cartões vinculados à conta corrente
  - Operações de crédito imobiliário, de arrendamento mercantil ou de investimento combinadas na mesma instituição
  - Prestação de serviços bancários gerais como cobranças, transferências e pagamentos
o_que_nao_inclui:
  - Bancos exclusivamente de investimento, sem carteira comercial (use CNAE 6421-2/00)
  - Bancos de desenvolvimento, como bancos estaduais de fomento (use CNAE 6423-9/00)
  - Caixas econômicas, como a Caixa Econômica Federal (use CNAE 6424-7/01)
  - Cooperativas de crédito que captam depósitos de associados (use CNAE 6430-1/00)
  - Sociedades de crédito, financiamento e investimento — financeiras — sem carteira comercial (use CNAE 6431-0/00)
  - Administradoras de cartões de crédito sem vínculo com banco múltiplo (use CNAE 6450-6/00)
licencas_comuns:
  - Autorização de funcionamento concedida pelo Banco Central do Brasil
  - Alvará municipal de funcionamento para cada agência ou sede
  - Auto de Vistoria do Corpo de Bombeiros (AVCB) para as instalações físicas
  - Licenças setoriais para operação de câmbio, quando aplicável
