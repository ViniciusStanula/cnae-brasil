exemplos_negocios:
  - Fábrica artesanal de linguiça e embutidos para açougues
  - Produtor de carne defumada e bacon com marca própria
  - Charcutaria com fabricação de presuntos e salames curados
  - Pequena indústria de hambúrgueres e almôndegas congelados
  - Produtor de carne de sol e charque para o varejo regional
o_que_inclui:
  - Fabricação de linguiça, salsicha, mortadela, presunto e salame
  - Produção de carnes defumadas, curadas e salgadas, como bacon e charque
  - Fabricação de hambúrgueres, almôndegas e empanados de carne
  - Temperado, moagem, embutimento, cozimento e defumação da carne
  - Embalagem e congelamento dos produtos de carne fabricados
  - Fabricação a partir de carne adquirida de frigoríficos ou de abate próprio
o_que_nao_inclui:
  - Abate de bovinos em frigorífico (use CNAE 1011-2/01)
  - Abate de aves (use CNAE 1012-1/01)
  - Preparação de subprodutos do abate, como sebo e farinhas (use CNAE 1013-9/02)
  - Fabricação de conservas de peixes, crustáceos e moluscos (use CNAE 1020-1/02)
  - Fabricação de pratos prontos e refeições congeladas (use CNAE 1096-1/00)
  - Comércio varejista de carnes em açougue (use CNAE 4722-9/01)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no serviço de inspeção (SIM, SIE ou SIF) conforme o alcance da venda
  - Licença da vigilância sanitária municipal ou estadual
  - Licença ambiental para tratamento de efluentes e resíduos
  - Registro de responsável técnico junto ao conselho profissional
  - Certificado de Vistoria do Corpo de Bombeiros
