  - Cuidador doméstico de idosos ou crianças em ambiente residencial
  - Jardineiro particular que cuida do jardim de uma residência
o_que_inclui:
  - Limpeza e arrumação de residências particulares
  - Preparo de refeições dentro da residência do empregador
  - Cuidados com crianças, idosos ou pessoas dependentes no ambiente doméstico
  - Lavagem e passagem de roupas no domicílio do empregador
  - Manutenção e organização geral do lar
  - Serviços de jardinagem realizados exclusivamente em residência particular
o_que_nao_inclui:
  - Empresas de limpeza que prestam serviços a terceiros de forma comercial (use CNAE 8121-4/00)
  - Serviços de cuidado e assistência a idosos em estabelecimentos especializados (use CNAE 8711-5/02)
  - Cuidado diurno de crianças em creches ou estabelecimentos similares (use CNAE 8891-2/00)
  - Serviços de jardinagem prestados a empresas ou condomínios (use CNAE 8130-3/00)
  - Serviços de lavanderia comercial para terceiros (use CNAE 9601-7/01)
licencas_comuns:
