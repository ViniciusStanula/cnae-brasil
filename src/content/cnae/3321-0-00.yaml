o_que_inclui:
  - Montagem e instalação de máquinas industriais na planta do cliente
  - Alinhamento, nivelamento e fixação de equipamentos
  - Conexão de utilidades elétricas, hidráulicas e pneumáticas
  - Comissionamento, testes e start-up das máquinas
  - Desmontagem e remontagem em mudança de layout
o_que_nao_inclui:
  - Manutenção e reparação de máquinas para usos industriais (use CNAE 3314-7/99)
  - Serviços de montagem de móveis de qualquer material (use CNAE 3329-5/01)
  - Instalação de outros equipamentos sem código próprio (use CNAE 3329-5/99)
  - Instalações elétricas em edificações (use CNAE 4321-5/00)
  - Fabricação de máquinas e equipamentos industriais (use o CNAE da fabricação correspondente)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no CREA com responsável técnico
  - Certificado de Vistoria do Corpo de Bombeiros
  - Cumprimento da NR-12 na entrega das máquinas instaladas
  - Programa de controle de riscos ocupacionais para trabalho em altura e içamento
