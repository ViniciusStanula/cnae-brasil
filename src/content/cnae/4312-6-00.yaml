exemplos_negocios:
  - Empresa de sondagem geotécnica para obras de engenharia civil
  - Serviço de perfuração de estacas para fundações de edificações
  - Empresa de investigação do subsolo para projetos de infraestrutura
  - Serviço de sondagem SPT (Standard Penetration Test) para laudos de solo
  - Empresa de perfuração horizontal dirigida para passagem de dutos e cabos
o_que_inclui:
  - Sondagem geotécnica do solo para fins de construção civil
  - Perfuração de furos de sondagem para investigação do subsolo
  - Execução de ensaios SPT (Standard Penetration Test) em campo
  - Perfuração para instalação de estacas e fundações profundas
  - Perfuração horizontal dirigida para passagem de tubulações e cabos subterrâneos
  - Coleta de amostras de solo e rocha para análise laboratorial no contexto de obras
o_que_nao_inclui:
  - Perfuração de poços para captação de água subterrânea (use CNAE 4291-0/00)
  - Extração de petróleo, gás natural ou minerais do subsolo (use CNAE 0600-0/01 ou divisão 07)
  - Demolição de edificações e estruturas (use CNAE 4311-8/01)
  - Preparação e terraplanagem de terrenos sem perfuração (use CNAE 4313-4/00)
  - Construção de fundações por métodos que não envolvam perfuração, como sapatas rasas (use CNAE 4391-6/00)
licencas_comuns:
  - Alvará municipal de funcionamento
  - Licença ambiental (para atividades com potencial impacto ao solo e subsolo)
  - Licenças setoriais de órgãos de recursos hídricos (quando próximo a aquíferos ou corpos d'água)
  - Anotação de Responsabilidade Técnica (ART) junto ao CREA para cada serviço executado
