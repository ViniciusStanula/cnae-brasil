exemplos_negocios:
  - Apicultor com colmeias próprias e venda de mel em feiras
  - Produtor de mel orgânico certificado para lojas de produtos naturais
  - Apiário com produção de própolis e extrato para revenda
  - Meliponicultor de abelhas nativas sem ferrão
  - Apicultor prestador de serviço de polinização em lavouras
o_que_inclui:
  - Instalação e manejo de colmeias e apiários
  - Produção e extração de mel, própolis, geleia real, pólen e cera de abelha
  - Criação de abelhas nativas sem ferrão (meliponicultura)
  - Envase do mel da própria produção para comercialização
  - Multiplicação de enxames e venda de colmeias povoadas
  - Serviço de polinização dirigida com colmeias próprias
o_que_nao_inclui:
  - Criação de bicho da seda, que tem código próprio (use CNAE 0159-8/04)
  - Criação de escargô (use CNAE 0159-8/03)
  - Criação de outros animais sem código específico (use CNAE 0159-8/99)
  - Fabricação de balas, doces e produtos à base de mel comprado de terceiros (use CNAE 1093-7/02)
  - Comércio atacadista de mel adquirido de terceiros (use CNAE 4632-0/01)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no serviço de inspeção (municipal, estadual ou federal) para venda de mel
  - Licença ambiental ou autorização do órgão estadual, conforme o caso
  - Cadastro no órgão estadual de agricultura
  - Licença da vigilância sanitária para a sala de extração e envase
