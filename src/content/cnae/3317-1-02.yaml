o_que_inclui:
  - Manutenção preventiva e corretiva de lanchas, veleiros e jet skis
  - Reparo de cascos de fibra de vidro, madeira ou alumínio
  - Manutenção de motores de popa e de centro
  - Serviços de pintura, polimento e antiincrustante
  - Reparo de sistemas elétricos e hidráulicos náuticos
o_que_nao_inclui:
  - Manutenção e reparação de embarcações e estruturas flutuantes comerciais (use CNAE 3317-1/01)
  - Construção de embarcações para esporte e lazer (use CNAE 3092-0/00)
  - Manutenção e reparação de máquinas motrizes não elétricas (use CNAE 3314-7/01)
  - Serviços de marinas e guarda de embarcações (use CNAE 5231-1/02)
  - Manutenção e reparação de veículos ferroviários (use CNAE 3315-5/00)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro na Marinha do Brasil para oficina de reparo naval
  - Licença ambiental para descarte de resíduos e tintas náuticas
  - Certificado de Vistoria do Corpo de Bombeiros
  - Programa de controle de riscos ocupacionais
