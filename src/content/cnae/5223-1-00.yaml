  - Aluguel de automóveis sem condutor (use CNAE 7711-0/00)
  - Guarda-móveis (use CNAE 5211-7/02)
  - Atividades de vigilância e segurança privada (use CNAE 8011-1/01)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Certificado de Vistoria do Corpo de Bombeiros
  - Seguro obrigatório de responsabilidade civil sobre os veículos guardados
  - Licença ambiental, quando houver área impermeabilizada de grande porte
  - Autorização municipal específica para estacionamento comercial
