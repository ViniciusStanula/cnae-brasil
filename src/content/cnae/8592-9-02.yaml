exemplos_negocios:
  - Escola de teatro para crianças e adultos
  - Estúdio de formação em artes circenses
  - Curso de improvisação teatral
  - Instrutor independente de mímica e expressão corporal
  - Escola de preparação para atores amadores
  - Oficina de teatro para empresas e grupos comunitários
o_que_inclui:
  - Aulas e cursos de teatro em qualquer modalidade (dramaturgia, interpretação, teatro físico)
  - Ensino de artes circenses como malabarismo, acrobacia e palhaçaria
  - Cursos de mímica e expressão corporal cênica
  - Oficinas de improvisação teatral
  - Formação de atores amadores ou profissionais em escola ou estúdio
  - Aulas particulares de técnicas cênicas ministradas por instrutor independente
o_que_nao_inclui:
  - Ensino de dança em qualquer estilo (use CNAE 8592-9/01)
  - Ensino de música, canto lírico ou técnica vocal musical (use CNAE 8592-9/03)
  - Ensino de arte e cultura em formato não especificado acima (use CNAE 8592-9/99)
  - Produção e apresentação de espetáculos teatrais ou circenses sem função de ensino (use CNAE 9001-9/01 ou 9001-9/03)
  - >-
    Ensino superior de artes cênicas em faculdades e universidades (use CNAE 8533-4/00 ou equivalente de ensino
    superior)
licencas_comuns:
  - Alvará municipal de funcionamento
  - Auto de Vistoria do Corpo de Bombeiros (AVCB)
  - Alvará sanitário, quando houver atendimento a crianças em espaço físico
  - Licença de uso e ocupação do solo conforme zoneamento municipal
