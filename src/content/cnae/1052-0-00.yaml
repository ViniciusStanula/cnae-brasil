exemplos_negocios:
  - Queijaria artesanal com produção de queijos maturados
  - Laticínio familiar com fabricação de queijo, manteiga e requeijão
  - Produtor de iogurte e bebida láctea para o varejo regional
  - Fábrica de doce de leite com marca própria
  - Agroindústria de queijo de leite de cabra
o_que_inclui:
  - Fabricação de queijos frescos, maturados e processados
  - Produção de iogurtes, bebidas lácteas e coalhadas
  - Fabricação de manteiga, requeijão, creme de leite e nata
  - Produção de doce de leite e leite condensado
  - Fabricação de leite em pó e produtos lácteos desidratados
  - Uso de leite da própria produção ou adquirido de terceiros
o_que_nao_inclui:
  - Preparação do leite para consumo, como pasteurização e envase (use CNAE 1051-1/00)
  - Fabricação de sorvetes e outros gelados comestíveis (use CNAE 1053-8/00)
  - Criação de bovinos para leite, sem industrialização (use CNAE 0151-2/02)
  - Comércio varejista de laticínios adquiridos de terceiros (use CNAE 4721-1/03)
  - Fabricação de alimentos para animais a partir de soro de leite (use CNAE 1066-0/00)
licencas_comuns:
