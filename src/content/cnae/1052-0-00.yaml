  - Registro no serviço de inspeção (SIM, SIE ou SIF) conforme o alcance da venda
  - Licença da vigilância sanitária municipal ou estadual
  - Registro de responsável técnico junto ao conselho profissional
  - Licença ambiental para tratamento de efluentes
  - Certificado de Vistoria do Corpo de Bombeiros
