  - Produtor de tomate e pimentão em ambiente protegido
  - Horta urbana com cultivo hidropônico de folhosas
o_que_inclui:
  - Cultivo de folhosas como alface, rúcula, couve, agrião e espinafre
  - Cultivo de legumes e frutos de horta, como tomate de mesa, pimentão, abobrinha e pepino
  - Cultivo de hortaliças em estufa, hidroponia ou canteiro a céu aberto
  - Cultivo de temperos frescos, como salsa, cebolinha e coentro
  - Lavagem, seleção e embalagem da própria produção para venda
  - Venda direta da produção própria em feiras, cestas ou entrega a comércios
o_que_nao_inclui:
  - Cultivo de morango, que tem código próprio (use CNAE 0121-1/02)
  - Cultivo de flores e plantas ornamentais (use CNAE 0122-9/00)
  - Cultivo de tomate rasteiro para indústria (use CNAE 0119-9/09)
  - Produção de mudas certificadas para venda a terceiros (use CNAE 0142-3/00)
  - Comércio varejista de hortaliças compradas de terceiros (use CNAE 4724-5/00)
licencas_comuns:
