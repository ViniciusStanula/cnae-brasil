  - Empresa de manutenção hidráulica predial
o_que_inclui:
  - Instalação de tubulações de água fria, quente e esgoto
  - Instalação de louças sanitárias, torneiras e metais
  - Execução de redes internas de gás e instalação de medidores
  - Instalação de caixas d'água, bombas e sistemas de recalque
  - Manutenção e reparo de instalações hidrossanitárias
o_que_nao_inclui:
  - Instalação e manutenção elétrica (use CNAE 4321-5/00)
  - Instalação de sistemas centrais de ar-condicionado (use CNAE 4322-3/02)
  - Instalações de sistema de prevenção contra incêndio (use CNAE 4322-3/03)
  - Atividades relacionadas a esgoto, como limpa-fossa (use CNAE 3702-9/00)
  - Perfuração e construção de poços de água (use CNAE 4399-1/05)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no CREA ou CAU com responsável técnico, quando exigido
  - Qualificação específica para instalação de redes de gás
  - Programa de controle de riscos ocupacionais e NR-18 para obras
  - Anotação de Responsabilidade Técnica (ART) por obra, quando exigida
