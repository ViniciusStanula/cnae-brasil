o_que_inclui:
  - Captação e represamento de água do mar em tanques de evaporação
  - Evaporação solar e cristalização do sal em salinas
  - Colheita, lavagem e empilhamento do sal bruto
  - Produção de flor de sal e sal marinho artesanal
  - Ensacamento do sal bruto da própria produção para venda
o_que_nao_inclui:
  - Extração de sal-gema em jazidas subterrâneas (use CNAE 0892-4/02)
  - Refino e outros tratamentos industriais do sal (use CNAE 0892-4/03)
  - Extração de minerais para fertilizantes e produtos químicos (use CNAE 0891-6/00)
  - Comércio atacadista de sal adquirido de terceiros (use CNAE 4632-0/01)
  - Fabricação de temperos e condimentos à base de sal (use CNAE 1095-3/00)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Licença ambiental estadual para operação da salina
  - Autorização de lavra ou registro na Agência Nacional de Mineração (ANM)
  - Outorga de uso de água e autorização para uso de área costeira
  - Registro no serviço de inspeção para sal destinado a consumo humano
