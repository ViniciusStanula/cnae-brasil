o_que_inclui:
  - Manutenção preventiva e corretiva de bombas e redutores
  - Reparo de máquinas de uso geral sem código específico
  - Substituição de rolamentos, vedações e componentes mecânicos
  - Alinhamento, balanceamento e testes de funcionamento
  - Serviço executado em oficina ou em campo
o_que_nao_inclui:
  - Manutenção de máquinas motrizes não elétricas (use CNAE 3314-7/01)
  - Manutenção de equipamentos hidráulicos e pneumáticos (use CNAE 3314-7/02)
  - Manutenção de compressores (use CNAE 3314-7/04)
  - Manutenção de outras máquinas para usos industriais (use CNAE 3314-7/99)
  - Instalação de máquinas e equipamentos industriais (use CNAE 3321-0/00)
licencas_comuns:
  - Alvará de funcionamento na prefeitura do município
  - Registro no CREA ou CRT com responsável técnico
  - Licença ambiental para descarte de óleos e resíduos
  - Certificado de Vistoria do Corpo de Bombeiros
  - Programa de controle de riscos ocupacionais
