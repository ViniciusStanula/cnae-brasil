  - Autorização do Detran ou do órgão de trânsito para remoção de veículos
  - Carteira Nacional de Habilitação compatível com o veículo de reboque
  - Licenciamento e vistoria do guincho
  - Seguro de responsabilidade civil sobre o veículo rebocado
