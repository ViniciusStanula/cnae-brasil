exemplos_negocios:
  - Estúdio cinematográfico com sets de filmagem para locação
  - Estúdio de produção audiovisual com infraestrutura técnica completa
  - Estúdio de gravação de conteúdo para streaming e plataformas digitais
  - Estúdio de produção de séries e longas-metragens
  - Estúdio com cenários e equipamentos para produções de televisão
o_que_inclui:
  - Operação de espaço físico equipado para gravação de filmes e produções audiovisuais
  - Disponibilização de sets, cenários e infraestrutura técnica para filmagens
  - Produção de filmes de ficção, documentários e conteúdo audiovisual em geral
  - Gravação de programas de televisão em estúdio próprio
  - Produção de vídeos institucionais e de entretenimento dentro da estrutura do estúdio
  - Serviços de iluminação, sonorização e suporte técnico integrados à operação do estúdio
o_que_nao_inclui:
  - Produção de filmes exclusivamente para fins publicitários (use CNAE 5911-1/02)
  - Atividades de produção cinematográfica ou de vídeo sem estrutura de estúdio próprio (use CNAE 5911-1/99)
  - Distribuição e comercialização de filmes e conteúdo audiovisual (use CNAE 5912-0/01)
  - Exibição de filmes em salas de cinema (use CNAE 5914-6/00)
  - Gravação de música e produção de álbuns sonoros (use CNAE 5920-1/00)
licencas_comuns:
  - Alvará municipal de funcionamento
  - Auto de Vistoria do Corpo de Bombeiros (AVCB)
  - Licença de uso e ocupação do solo
  - Cadastro em órgão de regulação do setor audiovisual
