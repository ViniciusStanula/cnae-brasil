exemplos_negocios:
  - Empresa de gerenciamento de obras residenciais e comerciais
  - Profissional autônomo que administra canteiros de obras para construtoras
  - Escritório de coordenação e fiscalização de reformas
  - Empresa de gestão de contratos e cronogramas de obras
  - Prestador de serviços de supervisão técnica de construções
o_que_inclui:
  - Coordenação e supervisão geral da execução de obras de construção civil
  - Gestão de equipes, subcontratados e fornecedores no canteiro de obras
  - Controle de cronograma, orçamento e andamento físico da obra
  - Fiscalização do cumprimento de normas técnicas e especificações de projeto
  - Administração de contratos de serviços e materiais vinculados à obra
  - Elaboração de relatórios de acompanhamento e prestação de contas ao contratante
o_que_nao_inclui:
  - Execução direta de serviços de alvenaria, como levantamento de paredes (use CNAE 4399-1/03)
  - Montagem e desmontagem de andaimes e estruturas temporárias (use CNAE 4399-1/02)
  - Operação e fornecimento de equipamentos de elevação de cargas em obras (use CNAE 4399-1/04)
  - Perfuração e construção de poços de água (use CNAE 4399-1/05)
  - Elaboração de projetos arquitetônicos ou de engenharia (use CNAE 7112-0/00)
  - Construção de edifícios por incorporadoras ou construtoras (use CNAE 4120-4/00)
licencas_comuns:
  - Alvará municipal de funcionamento
  - Registro em conselho profissional de engenharia ou arquitetura
  - Licença ambiental para obras com impacto ambiental
  - ART ou RRT por obra administrada
